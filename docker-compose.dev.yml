# 开发设置(前后端热重载)。使用方式:
#   cp .env.example .env
#   sudo docker compose -f docker-compose.dev.yml up
#   前端(热重载):http://localhost:5173   API 文档:http://localhost:5173/api/docs
name: scheduling-dev

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${DEV_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # 保留容器内安装的依赖,不被挂载覆盖
    depends_on:
      - api

  api:
    build:
      context: ./backend
    # dev:迁移后以 --reload 启动,源代码变更立即生效
    entrypoint: ["bash", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    env_file: .env
    environment:
      # 开发时打开互动式 API 文档，由前端开发服务器代理 /api；正式部署默认关闭
      API_DOCS_ENABLED: "true"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    # dev 用单一进程监听两条队列:ops 在前(导出/备份/发送邮件是秒级任务,优先处理),default 在后。
    # 正式环境拆成 worker + worker-ops 两个容器,排课才不会堵住导出(见 docker-compose.yml)。
    # 这里若只写 ["worker"],dev 就没有任何进程在守 ops——导出、备份、发送邮件、定时任务全失效。
    command: ["worker", "ops", "default"]
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scheduler}
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scheduler}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
