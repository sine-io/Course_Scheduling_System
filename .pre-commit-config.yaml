# 可选的本地 Git hook。安装方式：pip install pre-commit && pre-commit install
# 主要质量检查以 CI 为准；此配置用于在提交前发现常见问题。
repos:
  - repo: local
    hooks:
      - id: simplified-chinese-text
        name: 仓库中文规范检查
        entry: python3 scripts/check_simplified_chinese.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        name: Ruff（后端 lint 自动修正）
        args: [--fix]
        files: ^backend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
