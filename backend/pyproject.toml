[project]
name = "scheduling-backend"
version = "0.1.0"
description = "学校排课、调课与代课管理系统 — 后端 API 与排课引擎"
requires-python = ">=3.12"
# 核心依赖统一钉主版号上限。理由是踩过:redis 未设上限,某次重建装到 redis-py 8,
# 阻塞式 XREAD 的行为变了,导出/备份在新环境统一超时失败(v1.1 修)。
# 镜像是每次发行重新构建的,不钉上限就等于「哪天上游发大版,用户的部署自己坏掉」。
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "redis>=5.2,<9",
    "rq>=2.0,<3",
    "python-multipart>=0.0.18",
    "bcrypt>=4.2,<6",
    "itsdangerous>=2.2,<3",
    "openpyxl>=3.1,<4",
    # 排课引擎(M3-2)。wheel 约 29MB,amd64/arm64 均有 manylinux wheel。
    "ortools>=9.14,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]
# 导出(M5-1 起):PDF 生成。系统依赖(Pango 等)与中文字体只装在 worker 镜像;
# api 镜像保持精简,导出统一走后台任务(worker)。见 Dockerfile 的 worker 阶段。
export = [
    "weasyprint>=63",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入惯例:在参数默认值调用 Depends/require_roles 属正常用法
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Security",
    "fastapi.File",
    "app.core.auth.require_roles",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "perf: 性能测量测试(规模数据下的时间门槛)",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["app*"]
