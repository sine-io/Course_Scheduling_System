# 正式部署设置。使用方式:
#   cp .env.example .env   # 修改管理员密码与校名
#   sudo docker compose up -d
#   浏览器开 http://<主机IP>
#
# 六个容器:web(Caddy+前端)、api、worker(排课)、worker-ops(导出/备份/定时)、postgres、redis
#
# 两种部署方式,同一份文件:
#   从源代码构建:sudo docker compose up -d
#   拉取预建镜像:sudo docker compose pull && sudo docker compose up -d
#
# worker 与 worker-ops 是同一个镜像的两个进程:前者专跑自动排课(会占住好几分钟),
# 后者跑导出/备份/恢复/发送邮件与定时任务,两条队列互不堵塞(M6-2)。
# 镜像版本由 .env 的 IMAGE_TAG 决定(默认 latest;正式部署建议固定版本如 v1.0.0)。
name: scheduling

services:
  web:
    image: ghcr.io/begin0808/course_scheduling_system-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      # 默认 :80（内网 HTTP）。在 .env 中设置 SITE_ADDRESS=域名即可启用自动 HTTPS（见 docs/deploy/https.md）
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"   # 仅在设置域名启用 HTTPS 时使用;未用亦无妨
    volumes:
      - caddydata:/data            # 保存 HTTPS 证书,重启不必重新申请(避免触发 Let's Encrypt 速率限制)
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: ghcr.io/begin0808/course_scheduling_system-api:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      target: base
    restart: unless-stopped
    env_file: .env
    environment:
      # 让 api 也知道站点地址:设了域名(HTTPS)时自动开启 cookie Secure 标记
      SITE_ADDRESS: ${SITE_ADDRESS:-}
    volumes:
      - backups:/backups   # 列表/下载/上传(实际 pg_dump 在 worker)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 排课 worker:守 default 队列。一次自动排课可占住它好几分钟,这是预期行为。
  worker:
    image: ghcr.io/begin0808/course_scheduling_system-worker:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      target: worker
    command: ["worker"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - backups:/backups   # 与 worker-ops 共用(恢复前的 presafe 备份等)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 运维 worker:守 ops 队列(导出/备份/恢复/发送邮件),并兼任定时任务调度器。
  # 存在的理由:排课那几分钟,正是排课管理员最常按「导出课表」的时候——不该排在排课后面等。
  worker-ops:
    image: ghcr.io/begin0808/course_scheduling_system-worker:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      target: worker
    command: ["worker", "ops"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - backups:/backups   # pg_dump 写入、pg_restore 读取
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scheduler}
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scheduler}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 开发/测试用模拟 SMTP：拦截外发邮件，不会真正发送。正式部署不需要此服务
  # (将 SMTP 指向学校实际的邮件主机即可)。Web UI:http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "8025:8025"

volumes:
  pgdata:
  redisdata:
  backups:
  caddydata:
