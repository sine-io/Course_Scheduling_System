name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  text:
    name: 简体中文与术语检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描受版本控制的文本文件
        run: python3 scripts/check_simplified_chinese.py

  backend:
    name: 后端 lint / type / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: Ruff(格式与规则)
        run: ruff check .
      - name: Mypy(类型检查)
        run: mypy app
      - name: Pytest(单元测试)
        run: python -m pytest -q

  frontend:
    name: 前端 lint / build / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖(依 lock 文件完全重现)
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: 构建(含 vue-tsc 类型检查)
        run: npm run build
      - name: Vitest(单元测试)
        run: npm run test

  migrations:
    name: 数据库迁移验证(PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler
          POSTGRES_DB: scheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scheduler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: 对全新 PostgreSQL 执行 alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://scheduler:scheduler@localhost:5432/scheduler
        run: alembic upgrade head

  e2e:
    name: E2E 验收(Playwright 对 Docker 全栈)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # 在 runner 上以 buildx 建三个镜像(不推送,load 进本机 daemon)。
      # 不拉 :main 现成镜像的原因:PR 必须验 PR 自己的代码;
      # 缓存 scope 与 images job 共用,main 建过之后 PR 的构建只剩分钟级。
      - name: 构建 api 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: base
          load: true
          tags: ghcr.io/begin0808/course_scheduling_system-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: 构建 worker 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: worker
          load: true
          tags: ghcr.io/begin0808/course_scheduling_system-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: 构建 web 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          load: true
          tags: ghcr.io/begin0808/course_scheduling_system-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: 准备 .env 并启动全栈
        run: |
          cat > .env <<'EOF'
          ADMIN_USERNAME=admin
          ADMIN_PASSWORD=ci-admin-password
          SCHOOL_NAME=CI 测试学校
          SECRET_KEY=ci-e2e-not-a-secret-0123456789abcdef
          HTTP_PORT=80
          IMAGE_TAG=ci
          POSTGRES_USER=scheduler
          POSTGRES_PASSWORD=scheduler
          POSTGRES_DB=scheduler
          DATABASE_URL=postgresql+psycopg://scheduler:scheduler@postgres:5432/scheduler
          REDIS_URL=redis://redis:6379/0
          EOF
          sudo docker compose up -d --no-build --wait --wait-timeout 180
      - name: 创建 E2E 账号与向导状态
        run: sudo docker compose exec -T api python -m app.scripts.seed_e2e
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖与 Playwright 浏览器
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 执行 E2E 回归测试（Chromium）
        working-directory: frontend
        run: npm run e2e
      - name: 失败时收集容器记录
        if: failure()
        run: sudo docker compose logs --no-color > compose-logs.txt || true
      - name: 上传诊断产物(报告 / trace / 失败截图 / 容器记录)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
            compose-logs.txt
          retention-days: 7
          if-no-files-found: ignore

  images:
    name: 构建并发布镜像
    runs-on: ubuntu-latest
    # e2e 为前置:E2E 测试失败时不得发布镜像
    needs: [text, backend, frontend, migrations, e2e]
    # main push:仅 amd64(快速);版本标签 v*:amd64+arm64 双架构(正式发布)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 计算镜像名称(需小写)
        run: echo "IMAGE_BASE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: 决定构建架构与 channel 标签
        id: platforms
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "value=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.ref_name }}" == *-* ]]; then
              # 预发布(如 v1.0.0-rc1):建双架构供演练,但 channel 用自身标签,不动 :latest
              echo "channel=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            else
              # 正式版才更新 :latest;main push 仅单架构,不可覆盖 :latest
              # 否则 ARM 用户(IMAGE_TAG=latest)pull 到只有 amd64 的 manifest 会起不来
              echo "channel=latest" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "value=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "channel=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送 api 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: base
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          # ref_name:main push 为 "main";版本标签推送则为 "v1.0.0"(供 .env 的 IMAGE_TAG 固定)
          tags: |
            ${{ env.IMAGE_BASE }}-api:${{ steps.platforms.outputs.channel }}
            ${{ env.IMAGE_BASE }}-api:${{ github.ref_name }}
            ${{ env.IMAGE_BASE }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: 构建并推送 worker 镜像(含 PDF/字体依赖)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: worker
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-worker:${{ steps.platforms.outputs.channel }}
            ${{ env.IMAGE_BASE }}-worker:${{ github.ref_name }}
            ${{ env.IMAGE_BASE }}-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: 构建并推送 web 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-web:${{ steps.platforms.outputs.channel }}
            ${{ env.IMAGE_BASE }}-web:${{ github.ref_name }}
            ${{ env.IMAGE_BASE }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
