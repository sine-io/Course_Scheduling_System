# M5-4 验收③:以总量 ~4GB 的内存上限跑整套系统,验证全流程不 OOM。
# 叠在正式 compose 之上使用:
#   sudo docker compose -f docker-compose.yml -f docker-compose.limits.yml up -d
# 六容器上限合计约 3.7GB,留约 0.4GB 给主机与尖峰。亦可作为 4GB 主机/NAS 的部署参考。
#
# 两个 worker 的预算差很多,因为工作性质不同(M6-2):
#   worker      → 排课引擎(OR-Tools 求解 60 班会吃掉大半),分到最多
#   worker-ops  → 导出/备份/恢复/发送邮件;WeasyPrint 渲染一张 A4 课表的峰值远低于求解
name: scheduling

services:
  postgres:
    mem_limit: 512m
  redis:
    mem_limit: 256m
  api:
    mem_limit: 768m
  worker:
    mem_limit: 1536m
  worker-ops:
    mem_limit: 512m
  web:
    mem_limit: 128m
